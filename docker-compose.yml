name: ${COMPOSE_PROJECT_NAME:-himascore}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-himascore}-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-HIMASCORE}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:zt+iq36yjdKjm57YryC64V/z6EJWQkT1yUlLLnAZqBs=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-18080}}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_hima}
      DB_USERNAME: ${DB_APP_USER:-${DB_USERNAME:-root}}
      DB_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD:-admin123}}
    command: ["/var/www/html/docker/start-app.sh"]
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8000"
    depends_on:
      mysql:
        condition: service_started
    networks:
      - himascore-net

  queue:
    image: ${COMPOSE_PROJECT_NAME:-himascore}-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-HIMASCORE}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:zt+iq36yjdKjm57YryC64V/z6EJWQkT1yUlLLnAZqBs=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-18080}}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_hima}
      DB_USERNAME: ${DB_APP_USER:-${DB_USERNAME:-root}}
      DB_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD:-admin123}}
      QUEUE_CONNECTION: database
    command: ["/var/www/html/docker/start-queue.sh"]
    depends_on:
      mysql:
        condition: service_started
    networks:
      - himascore-net
    profiles:
      - worker

  vite:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port=5173"
    volumes:
      - ./:/var/www/html
    ports:
      - "127.0.0.1:${VITE_PORT:-15173}:5173"
    networks:
      - himascore-net
    profiles:
      - frontend

  mysql:
    image: mysql:8.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_hima}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-admin123}}
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER: ${DB_APP_USER:-hima_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-hima_app_pass}
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - mysql-data-clean-v4:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - himascore-net

networks:
  himascore-net:
    driver: bridge

volumes:
  mysql-data-clean-v4:
